<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>馬調教算盤 | 江戸オンライン</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3efe6;color:#302b24;font:15px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:22px 14px}header{border-bottom:2px solid #a88b49;padding:12px 0 20px;margin-bottom:20px}h1{font-family:serif;font-size:28px;margin:0 0 6px}small,.muted{color:#776d5c}section,article{background:#fffdf8;border:1px solid #d9d0bd;border-radius:10px;padding:16px;margin-bottom:14px}h2{font-size:17px;margin:0 0 12px} .inputs,.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}label{font-size:13px}input{width:100%;padding:10px 6px;border:1px solid #bfb39b;border-radius:5px;font-size:20px;background:white;color:#302b24;margin-top:6px}button{width:100%;background:#393127;color:#fff8e7;border:0;border-radius:6px;padding:12px;margin-top:14px;font-size:16px} .big{font-size:30px;font-weight:bold;color:#806221}p{margin:8px 0}table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}td,th{padding:6px;text-align:right;border-bottom:1px solid #e7e0d2}td:first-child,th:first-child{text-align:left}.scroll{max-height:240px;overflow:auto}th{position:sticky;top:0;background:#f3efe6} .near{background:#f5e9c8}svg{width:100%;height:auto}details{margin-top:12px}summary{cursor:pointer}#error{color:#a33} @media(max-width:650px){.results{grid-template-columns:1fr}.big{font-size:28px}}
 .entry{display:grid;grid-template-columns:48px repeat(3,minmax(0,1fr));gap:6px;align-items:center;margin:5px 0}.entry input{font-size:17px;margin:0;min-width:0}.entry span{font-size:13px}.totals{font-size:13px;color:#776d5c;margin-top:12px}.summary td,.summary th{white-space:nowrap}.wide{overflow-x:auto}.ability{margin-top:16px}.ability summary{font-weight:bold}.chart{max-width:540px;margin:auto}.results{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:650px){.results{grid-template-columns:1fr}.entry input{padding:8px 4px}}</style><main><header><small>江戸オンライン 非公式育成支援</small><h1>馬調教算盤</h1><div class="muted">四能力の育成計画</div></header><section><h2>能力値を入力</h2><form id="form"><div class="entry"><span></span><span>現在値</span><span>目標値</span><span>上限値</span></div><div id="inputs"></div><div id="totals" class="totals"></div><button type="button" id="maxbtn">全能力の目標を上限に設定</button><button>必要回数を計算</button></form><p id="error" role="alert"></p></section><div id="results" class="results"></div><section><h2>能力別の必要回数</h2><div class="wide" id="summary"></div></section><section><h2>能力の推移</h2><small>能力名をタップするとグラフと各回の上昇量を表示します。</small><div id="details"></div></section><section><h2>計算条件</h2><small>銭：残り能力÷上限×40、小判：同×60。<br>毎回四捨五入し最低+1、上限で打ち止め。<br>目標以上で終了。<br>小判→銭は小判の上昇量が+1になった時点で切り替え。<br>調子・銭の変動費用は未反映。<br>実測に基づく仮説であり、公式仕様ではありません。</small></section></main><script>
const $=id=>document.getElementById(id);const gain=(x,u,k)=>Math.min(u-x,Math.max(1,Math.floor((2*(u-x)*k+u)/(2*u))));function simulate(s,t,u,mode){let x=s,rows=[],coins=0,money=0;while(x<t){let k=mode===0?40:mode===1?60:gain(x,u,60)>1?60:40;let g=gain(x,u,k);rows.push({before:x,after:x+g,g,k});x+=g;k===60?coins++:money++}return {rows,coins,money,x}}const fmt=n=>n.toLocaleString('ja-JP');
const abilities=['速力','持久','瞬発','賢さ'], names=['銭調教のみ','小判調教のみ','小判 → 銭切替'],colors=['#76634c','#ad822a','#52736b'];
$('inputs').innerHTML=abilities.map((a,i)=>`<div class="entry"><span>${a}</span>${['現在値','目標値','上限値'].map((l,j)=>`<input aria-label="${a} ${l}" id="v${i}${j}" type="number" inputmode="numeric" min="${j===2?1:0}" max="100000" step="1" required value="${j===0?[752,752,729,731][i]:j===1?800:820}">`).join('')}</div>`).join('');
function draw(chart,s,t,rs){let max=Math.max(1,...rs.map(r=>r.rows.length)),lo=Math.min(s,t),hi=Math.max(lo+1,s,t,...rs.map(r=>r.x)),X=n=>45+ n/max*520,Y=v=>145-(v-lo)/(hi-lo)*110;let lines=rs.map((r,i)=>`<polyline fill="none" stroke="${colors[i]}" stroke-width="2.5" ${i===2?'stroke-dasharray="5 4"':''} points="${[[0,s],...r.rows.map((v,j)=>[j+1,v.after])].map(([n,v])=>X(n)+','+Y(v)).join(' ')}"/>`).join('');chart.innerHTML=`<svg viewBox="0 0 590 180" role="img" aria-label="調教回数と能力の推移"><path d="M45 25V145H565" fill="none" stroke="#c9bda8"/><line x1="45" x2="565" y1="${Y(t)}" y2="${Y(t)}" stroke="#a99b83" stroke-dasharray="3 4"/><g font-size="11" fill="#776d5c"><text x="3" y="${Y(t)+4}">${t}</text><text x="3" y="149">${lo}</text><text x="45" y="163">0</text><text x="540" y="163">${max}回</text></g>${lines}</svg><div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px">${names.map((n,i)=>`<span style="color:${colors[i]}">━ ${n}</span>`).join('')}</div>`}
function run(){const inputs=[...$('inputs').querySelectorAll('input')], data=abilities.map((a,i)=>[0,1,2].map(j=>+$(`v${i}${j}`).value));if(inputs.some(e=>e.value===''||!e.validity.valid)||data.some(([s,t,u])=>s>u||t>u)){$('error').textContent='各能力の現在値・目標値は上限以下の整数にしてください。';for(const id of ['results','summary','details','totals'])$(id).innerHTML='';return;}$('error').textContent='';const sums=[0,1,2].map(j=>data.reduce((n,d)=>n+d[j],0));$('totals').textContent=`総合力：現在 ${fmt(sums[0])} ／ 目標 ${fmt(sums[1])} ／ 上限 ${fmt(sums[2])}`;const all=data.map(([s,t,u])=>names.map((_,i)=>simulate(s,t,u,i)));$('results').innerHTML=names.map((name,i)=>{const rs=all.map(a=>a[i]),n=rs.reduce((a,r)=>a+r.rows.length,0),c=rs.reduce((a,r)=>a+r.coins,0),m=rs.reduce((a,r)=>a+r.money,0);return `<article><h2>${name}</h2><div class="big">${fmt(n)}回</div>${i===0?'':i===1?`<p>小判 ${fmt(c*50)}枚</p>`:`<p>小判 ${fmt(c)}回 ／ 銭 ${fmt(m)}回</p><p>小判 ${fmt(c*50)}枚</p><small>小判調教の上昇量が+1になった時点で銭調教に切り替えます。</small>`}<p>到達総合力：${fmt(rs.reduce((a,r)=>a+r.x,0))}</p></article>`}).join('');$('summary').innerHTML=`<table class="summary"><thead><tr><th>能力</th><th>銭のみ</th><th>小判のみ</th><th>切替</th></tr></thead><tbody>${all.map((rs,i)=>`<tr><td>${abilities[i]}</td>${rs.map(r=>`<td>${r.rows.length}回</td>`).join('')}</tr>`).join('')}</tbody></table>`;const opened=[...$('details').querySelectorAll('details.ability')].map(d=>d.open);$('details').innerHTML=all.map((rs,i)=>`<details class="ability" ${opened[i]?'open':''}><summary>${abilities[i]} ${data[i][0]} → ${data[i][1]}（上限${data[i][2]}）</summary><div class="chart" id="chart${i}"></div>${rs.map((r,j)=>{let n=r.rows.length,prev=n?r.rows[n-1].before:data[i][0];return `<article><h2>${names[j]}：${n}回</h2><p>到達値 ${r.x}${j===0?'':j===1?` ／ 小判 ${fmt(r.coins*50)}枚`:` ／ 小判 ${fmt(r.coins)}回 ／ 銭 ${fmt(r.money)}回 ／ 小判 ${fmt(r.coins*50)}枚`}</p>${j===2?'<small>小判調教の上昇量が+1になった時点で銭調教に切り替えます。</small>':''}${n?`<p class="muted">1回手前：${prev}（目標まで${data[i][1]-prev}）／ ${n-1}回</p>`:''}<details><summary>全調教の推移</summary><div class="scroll"><table><thead><tr><th>回</th><th>増加</th><th>能力</th><th>方法</th></tr></thead><tbody>${r.rows.map((v,k)=>`<tr class="${v.after>=data[i][1]-1?'near':''}"><td>${k+1}</td><td>+${v.g}</td><td>${v.after}</td><td>${v.k===60?'小判':'銭'}</td></tr>`).join('')}</tbody></table></div></details></article>`}).join('')}</details>`).join('');all.forEach((rs,i)=>draw($('chart'+i),data[i][0],data[i][1],rs));}
$('form').addEventListener('submit',e=>{e.preventDefault();run()});$('inputs').addEventListener('input',run);$('maxbtn').addEventListener('click',()=>{abilities.forEach((_,i)=>$(`v${i}1`).value=$(`v${i}2`).value);run()});run();</script></html>
